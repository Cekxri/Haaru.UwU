[package]
name = "haaru-core"
version = "0.7.2"
edition = "2021"
rust-version = "1.100"
license = "Apache-2.0"
description = "Safe data and migration core for Haaru KernelSU"

[lib]
name = "haaru_core"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "haaru-upgrade"
path = "src/bin/haaru-upgrade.rs"

[[bin]]
name = "haaru-core-probe"
path = "src/bin/haaru-core-probe.rs"

[[bin]]
name = "haaru-status"
path = "src/bin/haaru-status.rs"

[dependencies]
serde_json = "=1.0.154"
libc = "=0.2.191"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

